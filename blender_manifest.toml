schema_version = "1.0.0"

# Blender 4.2+ extension manifest — the single source of the add-on
# version (read at runtime by constants.ADDON_VERSION).

id = "aquasuite"
version = "0.15.0"
name = "AquaSuite — Water FX"
tagline = "One-click layered water: ocean, rain, snow, liquid, hose"
maintainer = "AquaSuite"
type = "add-on"

website = "https://github.com/Blaxine/aquasuite"

tags = ["Physics", "Object", "3D View"]

blender_version_min = "4.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

# No bundled wheels, no network access: AquaSuite uses only Blender's
# built-in Python modules (bpy, bmesh, mathutils) and the standard
# library. Zero external dependencies.

[permissions]
files = "Write simulation caches to //aquasuite_cache next to the .blend"

# Only the add-on ships: plans, tests, local config and git data never do.
[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.*",
  "/*.zip",
  "/requirements/",
  "/tests/",
  "/aquasuite_cache/",
  "/public_repo/",
  "/docs/TESTING.md",
  "/docs/THESAURUS.md",
  "/docs/RELEASE_CHECKLIST.md",
]
